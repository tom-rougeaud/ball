<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Abel Run</title>
<meta name="description" content="Abel Run : jeu de course minimaliste en 3D. Glisse le doigt ou utilise les flèches du clavier.">
<meta name="theme-color" content="#1B2236">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abel Run">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--ink:#1B2236;--ink2:#27314D;--ivory:#EEE9DF;--haze:#DED6C8;--terra:#C4614A;--sage:#7E9C86;--slate:#34405C;--u:4px;
  --font:"Avenir Next","Helvetica Neue","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--ink);font-family:var(--font);
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#icv{z-index:7;pointer-events:none;transition:opacity .5s ease}
#veil{position:absolute;inset:0;background:var(--ivory);opacity:0;pointer-events:none;z-index:2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Logo permanent */
#brand{position:fixed;left:50%;z-index:9;pointer-events:none;opacity:0;
  top:calc(env(safe-area-inset-top,0px) + var(--u)*2.6);width:calc(var(--u)*30);transform:translateX(-50%);
  transition:top .6s cubic-bezier(.3,.8,.3,1),width .6s cubic-bezier(.3,.8,.3,1),opacity .6s ease}
#brand svg{display:block;width:100%;height:auto;overflow:visible}
#brand.on{opacity:1}
body.m-menu #brand{top:calc(env(safe-area-inset-top,0px) + var(--u)*9);width:calc(var(--u)*72)}

/* HUD */
#hud{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .5s ease}
#hud.on{opacity:1}
.sc{position:absolute;left:calc(var(--u)*5);top:calc(env(safe-area-inset-top,0px) + var(--u)*4);font-size:calc(var(--u)*10.5);font-weight:200;font-variant-numeric:tabular-nums;line-height:1}
.sc small{display:block;font-size:max(9px,calc(var(--u)*2.3));letter-spacing:.3em;text-transform:uppercase;opacity:.55;margin-top:calc(var(--u)*1.6);font-weight:700}
.lv{position:absolute;right:calc(var(--u)*5);top:calc(env(safe-area-inset-top,0px) + var(--u)*4.4);text-align:right;font-size:max(9px,calc(var(--u)*2.4));letter-spacing:.26em;text-transform:uppercase;font-weight:700;line-height:1.5}
.lv span{display:block;opacity:.55}
.dots{margin-top:calc(var(--u)*1.2)}
.dots i{display:inline-block;width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:50%;border:calc(var(--u)*.36) solid currentColor;margin-left:calc(var(--u)*1.1)}
.dots i.f{background:currentColor}
#cap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*16);text-align:center;font-size:max(10px,calc(var(--u)*3));letter-spacing:.34em;text-transform:uppercase;font-weight:700;opacity:0}
#cap.on{animation:cap 2s ease both}
#ptop{position:absolute;left:6%;right:6%;top:calc(env(safe-area-inset-top,0px) + var(--u)*24);text-align:center;font-size:max(18px,calc(var(--u)*5.4));letter-spacing:.06em;font-weight:600;color:#4a5580;text-shadow:0 0 18px rgba(255,255,255,.95),0 0 4px rgba(255,255,255,.9);opacity:0;pointer-events:none}
#ptop.on{animation:ptop 5.5s ease both}
@keyframes ptop{0%{opacity:0;filter:blur(10px);transform:translateY(-8px) scale(.94)}16%{opacity:1;filter:blur(0);transform:none}78%{opacity:1;filter:blur(0)}100%{opacity:0;filter:blur(8px);transform:translateY(4px) scale(1.04)}}
body.fin #ptop{opacity:0!important}
body.par .sc{left:0;right:0;text-align:center;top:calc(env(safe-area-inset-top,0px) + var(--u)*9.4)}
body.par #ptop{top:calc(env(safe-area-inset-top,0px) + var(--u)*31)}
@keyframes cap{0%{opacity:0;transform:translateY(6px)}14%{opacity:.85;transform:none}74%{opacity:.85}100%{opacity:0}}
.fix{position:fixed;z-index:9;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*3);height:calc(var(--u)*8.4);min-height:34px;padding:0 calc(var(--u)*3.2);border-radius:999px;border:1.5px solid rgba(27,34,54,.35);background:rgba(238,233,223,.7);color:var(--ink);font-size:max(11px,calc(var(--u)*3));font-weight:700;letter-spacing:.06em}
body.fin #hud,body.fin #bpause,body.fin #bmute,body.fin #cap{opacity:0!important;pointer-events:none;transition:opacity .6s}
#bmute{left:calc(env(safe-area-inset-left,0px) + var(--u)*4)}
#bpause{right:calc(env(safe-area-inset-right,0px) + var(--u)*4);display:none}
body.playing #bpause{display:block}
body.intro .fix{background:rgba(238,233,223,.14);color:var(--ivory);border-color:rgba(238,233,223,.35)}

/* Écrans */
.screen{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2.8);
  padding:calc(env(safe-area-inset-top,0px) + var(--u)*14) calc(var(--u)*5) calc(env(safe-area-inset-bottom,0px) + var(--u)*14);
  text-align:center;opacity:0;pointer-events:none;transition:opacity .45s ease;overflow:auto}
.screen.on{opacity:1;pointer-events:auto}
#menu{padding-top:calc(env(safe-area-inset-top,0px) + var(--u)*31);justify-content:flex-start}
#panel{background:rgba(27,34,54,.55);z-index:8}
.sub{margin:0;font-size:max(11px,calc(var(--u)*3));letter-spacing:.38em;text-transform:uppercase;font-weight:700;opacity:.7}
.shqr{display:block;margin:calc(var(--u)*2) auto;width:min(72vw,300px);height:auto}
.shqr svg{display:block;width:100%;height:auto}
.shlink{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.shlink input{flex:1 1 200px;min-width:0;font:inherit;font-size:max(12px,calc(var(--u)*3));padding:8px 10px;border-radius:10px;border:1.5px solid rgba(27,34,54,.35);background:rgba(27,34,54,.05);color:inherit}
.card details{border:1.5px solid rgba(27,34,54,.2);border-radius:12px;margin:6px 0;padding:0 12px;background:rgba(27,34,54,.04)}
.card summary{cursor:pointer;font-weight:700;padding:10px 0;list-style-position:inside}
.card details ol,.card details ul{margin:0 0 10px;padding-left:1.3em}
.card details p{margin:0 0 10px}
.shnote{font-size:max(11px,calc(var(--u)*2.8));opacity:.75}
.cdisp{display:flex;gap:calc(var(--u)*1.4);justify-content:center;margin:calc(var(--u)*1.6) 0}
.cdisp span{width:calc(var(--u)*8);max-width:44px;height:calc(var(--u)*10);max-height:54px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:2px solid rgba(27,34,54,.35);background:rgba(27,34,54,.06);font-size:calc(var(--u)*5.2);font-weight:700;font-variant-numeric:tabular-nums}
.cmsg{text-align:center;min-height:1.4em;font-weight:700}
.ckb{display:grid;grid-template-columns:repeat(9,1fr);gap:calc(var(--u)*1)}
.ckey{min-height:40px;border-radius:10px;border:1.5px solid rgba(27,34,54,.35);background:rgba(27,34,54,.06);color:inherit;font:inherit;font-weight:700;font-size:max(13px,calc(var(--u)*3.4));padding:0}
.ckey.w{grid-column:span 2;font-size:max(11px,calc(var(--u)*2.8))}
.ckey:active{background:rgba(27,34,54,.22)}
#chpick select{font:inherit;min-height:38px;border-radius:10px;padding:0 6px;max-width:46%}
.rec{display:flex;gap:calc(var(--u)*1.4);justify-content:center;flex-wrap:nowrap}
.rec .tile{flex:1 1 0;min-width:0;padding:calc(var(--u)*1.8) calc(var(--u)*.8);text-align:center}
.rec .tile b{font-size:clamp(16px,calc(var(--u)*5.2),32px);overflow:hidden;text-overflow:ellipsis}
.rec .tile i{display:block;font-size:max(8px,calc(var(--u)*2));letter-spacing:.05em;white-space:nowrap}
.tile{min-width:calc(var(--u)*26);padding:calc(var(--u)*2) calc(var(--u)*2.4);border-radius:calc(var(--u)*3.4);background:rgba(238,233,223,.62);border:1.5px solid rgba(27,34,54,.16)}
.tile b{display:block;font-size:calc(var(--u)*6.4);font-weight:300;font-variant-numeric:tabular-nums}
.tile i{font-style:normal;font-size:max(9px,calc(var(--u)*2.3));letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.big{border:0;background:var(--ink);color:var(--ivory);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:max(15px,calc(var(--u)*4.6));
  padding:calc(var(--u)*2.8) calc(var(--u)*10);border-radius:999px;box-shadow:0 calc(var(--u)*.8) 0 #0d1220,0 calc(var(--u)*2.4) calc(var(--u)*5) rgba(27,34,54,.3)}
.big:active{transform:translateY(2px)}
.pill{font-size:max(11px,calc(var(--u)*3));font-weight:700;letter-spacing:.05em;padding:calc(var(--u)*1.6) calc(var(--u)*3.4);border-radius:999px;border:1.5px solid rgba(27,34,54,.35);background:rgba(238,233,223,.6)}
.pill.danger{border-color:#A33B2C;color:#8A2E21}
.row{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.8);justify-content:center}
.hint{margin:0;font-size:max(11px,calc(var(--u)*3));opacity:.75;max-width:calc(var(--u)*80)}
h2{margin:0;font-size:calc(var(--u)*7);font-weight:800;letter-spacing:.04em}
.badge{font-size:calc(var(--u)*3.6);font-weight:800;color:var(--terra);min-height:1.2em}
.bigscore{font-size:calc(var(--u)*17);font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.card{max-width:calc(var(--u)*100);width:100%;max-height:100%;overflow:auto;padding:calc(var(--u)*5);border-radius:calc(var(--u)*5);background:var(--ivory);color:var(--ink);text-align:left;line-height:1.5;
  font-size:max(13px,calc(var(--u)*3.4));-webkit-user-select:text;user-select:text;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card h2{font-size:calc(var(--u)*6)}
.card p,.card li{margin:calc(var(--u)*1.4) 0}
.card .rec,.card .row{justify-content:center}

/* Intro */
#cine{position:fixed;inset:0;z-index:40;display:none;opacity:0;transition:opacity 2.5s ease;background:#fff;touch-action:none}
#cine canvas{position:absolute;inset:0;width:100%;height:100%}
#cinetx{position:absolute;left:0;right:0;bottom:15%;text-align:center;padding:0 8%;font:italic 400 clamp(18px,4.2vw,34px)/1.45 Georgia,"Times New Roman",serif;color:#39426A;text-shadow:0 0 18px rgba(255,255,255,.95),0 0 5px rgba(255,255,255,.9);min-height:3em}
#cineskip{position:absolute;right:16px;bottom:16px;opacity:0;pointer-events:none;transition:opacity 1s}
#cineskip.on{opacity:.85;pointer-events:auto}
#skip{position:fixed;z-index:10;right:calc(env(safe-area-inset-right,0px) + var(--u)*4);bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*3);display:none}
body.intro #skip{display:block}
#updp{position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);display:none;align-items:center;gap:calc(var(--u)*2.4);max-width:92vw;padding:calc(var(--u)*1.6) calc(var(--u)*2.4) calc(var(--u)*1.6) calc(var(--u)*4);border-radius:999px;background:#1B2236;color:#fff;font-weight:700;font-size:max(13px,calc(var(--u)*3.3));box-shadow:0 6px 20px rgba(0,0,0,.35)}
#updp.on{display:flex}
#updp button{border:0;border-radius:999px;background:#7BD6A4;color:#10281c;font-weight:800;font-size:inherit;padding:calc(var(--u)*1.6) calc(var(--u)*3.4);min-height:36px}
#joy{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*4);width:calc(var(--u)*40);height:calc(var(--u)*1.2);margin-left:calc(var(--u)*-20);border-radius:99px;background:rgba(27,34,54,.18);z-index:8;display:none;pointer-events:none}
#joy i{position:absolute;top:50%;left:50%;width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);margin:calc(var(--u)*-1.8) 0 0 calc(var(--u)*-1.8);border-radius:50%;background:var(--ink)}

/* Palette v2.3 : bleus francs, textes clairs sur fond sombre */
body{color:var(--ivory)}
.screen{color:var(--ivory)}
.screen:not(#panel):not(#shop){background:linear-gradient(rgba(10,18,44,.52),rgba(10,18,44,.74))}
.sc,.lv,#cap{color:#F4EFE6;text-shadow:0 0 3px rgba(8,14,36,.95),0 0 7px rgba(8,14,36,.8),0 1px 10px rgba(8,14,36,.65)}
.fix{background:rgba(10,18,44,.62);color:#F4EFE6;border-color:rgba(244,239,230,.5)}
body.intro .fix{background:rgba(244,239,230,.14);border-color:rgba(244,239,230,.4)}
.tile{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3);color:#F4EFE6}
.pill{background:rgba(255,255,255,.12);border-color:rgba(244,239,230,.55);color:#F4EFE6}
.pill.danger{border-color:#E58A7A;color:#FFB4A6}
.big{background:#E2674C;color:#fff;box-shadow:0 calc(var(--u)*.8) 0 #9E3A27,0 calc(var(--u)*2.4) calc(var(--u)*5) rgba(8,14,36,.45)}
.hint{opacity:.9}
.card{color:#1B2236}
.card .pill{background:rgba(27,34,54,.07);color:#1B2236;border-color:rgba(27,34,54,.4)}
.card .pill.danger{color:#8A2E21;border-color:#A33B2C}
.card .tile{background:rgba(27,34,54,.07);color:#1B2236;border-color:rgba(27,34,54,.2)}
.card .big{color:#fff}
#joy{background:rgba(255,255,255,.3)}
#joy i{background:#F4EFE6}

/* ===== Accueil v2.6 : curseur de niveau, visage, gros bouton, menu sandwich ===== */
#menu{gap:calc(var(--u)*3.2);padding-top:calc(env(safe-area-inset-top,0px) + var(--u)*24);padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*12);justify-content:center;--tc:#9BCB3B;--tcd:#5F8A14;--tt:#1F3305;--tl:#C6EE74}
body.m-menu #brand{width:calc(var(--u)*62)}
#face{width:calc(var(--u)*28);height:calc(var(--u)*28);display:block;overflow:visible;filter:drop-shadow(0 calc(var(--u)*1) calc(var(--u)*1.6) rgba(0,0,0,.4))}
.lvhead{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.9)}
.lvk{margin:0;font-size:max(10px,calc(var(--u)*2.6));letter-spacing:.34em;text-transform:uppercase;font-weight:700;opacity:.85}
.lvname{margin:0;font-size:calc(var(--u)*11);font-weight:800;letter-spacing:.03em;line-height:1.05;color:var(--tl);text-shadow:0 2px 0 rgba(0,0,0,.28),0 0 calc(var(--u)*4) rgba(0,0,0,.4);transition:color .25s}
.lvd{margin:0;font-size:max(12px,calc(var(--u)*3.3));opacity:.95;min-height:1.35em;max-width:calc(var(--u)*84)}
.slw{width:calc(var(--u)*86);max-width:100%;--tw:calc(var(--u)*11);display:flex;flex-direction:column;gap:calc(var(--u)*1.2)}
.sl{position:relative;height:var(--tw)}
.sltrack{position:absolute;left:0;right:0;top:50%;height:calc(var(--u)*4.6);margin-top:calc(var(--u)*-2.3);border-radius:99px;border:calc(var(--u)*.55) solid rgba(255,255,255,.8);
  background:linear-gradient(90deg,#38C172 0%,#9BCB3B 25%,#F2B632 50%,#EC6A2C 75%,#8E1010 100%);box-shadow:0 calc(var(--u)*.6) calc(var(--u)*1.6) rgba(0,0,0,.4)}
.sltick{position:absolute;top:50%;width:calc(var(--u)*1.7);height:calc(var(--u)*1.7);margin:calc(var(--u)*-.85) 0 0 calc(var(--u)*-.85);border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 0 0 calc(var(--u)*.3) rgba(0,0,0,.35);pointer-events:none}
.sl input{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;touch-action:none;cursor:pointer;outline:none}
.sl input::-webkit-slider-runnable-track{height:var(--tw);background:transparent;border:0}
.sl input::-moz-range-track{height:var(--tw);background:transparent;border:0}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;box-sizing:border-box;width:var(--tw);height:var(--tw);border-radius:50%;background:var(--tc);border:calc(var(--u)*1.1) solid #fff;box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2) rgba(0,0,0,.5);transition:background .25s}
.sl input::-moz-range-thumb{box-sizing:border-box;width:var(--tw);height:var(--tw);border-radius:50%;background:var(--tc);border:calc(var(--u)*1.1) solid #fff;box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2) rgba(0,0,0,.5)}
.sl input:focus-visible::-webkit-slider-thumb{outline:3px solid #fff;outline-offset:3px}
.sl input:focus-visible::-moz-range-thumb{outline:3px solid #fff;outline-offset:3px}
.slends{display:flex;justify-content:space-between;font-size:max(10px,calc(var(--u)*2.5));letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.8;padding:0 calc(var(--u)*1)}
.play{width:calc(var(--u)*86);max-width:100%;border:0;border-radius:calc(var(--u)*10);padding:calc(var(--u)*5.6) 0;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*3.4);
  font-size:calc(var(--u)*10.5);font-weight:900;letter-spacing:.12em;text-transform:uppercase;line-height:1;background:var(--tc);color:var(--tt);
  box-shadow:0 calc(var(--u)*1.5) 0 var(--tcd),0 calc(var(--u)*3.6) calc(var(--u)*6) rgba(0,0,0,.45);transition:background .25s,box-shadow .25s,color .25s}
.play::before{content:"";width:0;height:0;border-style:solid;border-width:calc(var(--u)*4.4) 0 calc(var(--u)*4.4) calc(var(--u)*7.4);border-color:transparent transparent transparent currentColor}
.play:active{transform:translateY(calc(var(--u)*1));box-shadow:0 calc(var(--u)*.5) 0 var(--tcd),0 calc(var(--u)*1.6) calc(var(--u)*3) rgba(0,0,0,.4)}
.play:focus-visible{outline:3px solid #fff;outline-offset:4px}
.recl{margin:0;font-size:max(12px,calc(var(--u)*3.2));opacity:.9;font-variant-numeric:tabular-nums}
.mini{margin:0;font-size:max(10px,calc(var(--u)*2.6));opacity:.65;max-width:calc(var(--u)*80)}
#bburger{position:fixed;z-index:9;top:calc(env(safe-area-inset-top,0px) + var(--u)*3.4);right:calc(env(safe-area-inset-right,0px) + var(--u)*4);width:calc(var(--u)*11.5);height:calc(var(--u)*11.5);min-width:44px;min-height:44px;border-radius:50%;
  border:1.5px solid rgba(244,239,230,.55);background:rgba(10,18,44,.6);display:none;align-items:center;justify-content:center;flex-direction:column;gap:calc(var(--u)*1.3);padding:0}
body.m-menu #bburger{display:flex}
body.pnl #bburger{display:none}
#bburger i{display:block;width:calc(var(--u)*5.2);min-width:18px;height:calc(var(--u)*.75);min-height:2px;border-radius:2px;background:#F4EFE6;transition:transform .25s,opacity .2s}
#bburger[aria-expanded="true"] i:nth-child(1){transform:translateY(calc(var(--u)*2.05)) rotate(45deg)}
#bburger[aria-expanded="true"] i:nth-child(2){opacity:0}
#bburger[aria-expanded="true"] i:nth-child(3){transform:translateY(calc(var(--u)*-2.05)) rotate(-45deg)}
#drawer{position:fixed;inset:0;z-index:9;display:none;background:rgba(8,14,36,.4)}
#drawer.on{display:block}
#drawer .dbox{position:absolute;right:calc(env(safe-area-inset-right,0px) + var(--u)*4);top:calc(env(safe-area-inset-top,0px) + var(--u)*16.5);width:calc(var(--u)*68);max-width:calc(100vw - 32px);
  background:#F4EFE6;color:#1B2236;border-radius:calc(var(--u)*4);padding:calc(var(--u)*1.6);box-shadow:0 20px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;animation:drw .18s ease both}
@keyframes drw{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.gic:before{content:"";width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18)}
.gic.app:before{background:#F4EFE6 radial-gradient(circle at 38% 34%,#fff,#C9CEDA 50%,#566079 100%)}
.gic em{font-style:normal}
.gw{flex:1;display:flex;flex-direction:column;background:#fff;position:relative}
.gwt{height:26px;flex:none;background:#CBD0DB;display:flex;align-items:flex-end;padding:0 8px}
.gtab{background:#F2F3F6;border-radius:8px 8px 0 0;padding:5px 14px;font-size:9.5px}
.gwb{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;background:#F2F3F6;font-size:12px}
.gwb .gad{padding:4px 9px}
.gic2{position:absolute;right:6px;top:2px;font-style:normal;font-size:13px;font-weight:700;padding:0 4px;border-radius:5px}
.gpo{position:absolute;right:30px;top:62px;width:170px;background:#fff;border-radius:10px;box-shadow:0 6px 22px rgba(27,34,54,.4);padding:10px;z-index:2;text-align:left}
.gpo p{margin:3px 0 4px;font-size:10px;opacity:.75}
.gmb{height:20px;flex:none;background:#E9EBF0;display:flex;gap:16px;align-items:center;padding:0 12px;font-size:10px}
.gmb span,.gmb b{padding:2px 4px;border-radius:4px}
.gdk{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:flex;gap:8px;align-items:flex-end;padding:6px 10px;background:rgba(255,255,255,.35);border-radius:14px}
.gdk u{width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.6)}.gdk .gic:before{width:28px;height:28px;border-radius:7px}
.gdesk{flex:1;background:linear-gradient(160deg,#3A4A78,#1B2236 70%);position:relative}
.gtgt{outline:2px solid #E1A93A;outline-offset:2px;animation:gpl 1s ease-in-out infinite}
@keyframes gpl{50%{outline-color:rgba(225,169,58,.2)}}
.gpress{background:rgba(225,169,58,.4)!important}
.gfg{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;z-index:9;pointer-events:none;transition:transform .8s cubic-bezier(.5,0,.2,1)}
.gfg i{position:absolute;inset:0;border-radius:50%;background:rgba(27,34,54,.45);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.gfg.tap i{animation:gtap .45s ease-out}
@keyframes gtap{0%{transform:scale(1)}40%{transform:scale(.7)}100%{transform:scale(1)}}
.gfg.cur{width:18px;height:24px;margin:0}
.gfg.cur i{background:none;border:0;box-shadow:none;border-radius:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 24'><path d='M1 1v18l4.5-4.2 3.2 7.2 3-1.4-3.2-7H15z' fill='%231B2236' stroke='white' stroke-width='1.4'/></svg>") no-repeat}
.gcap{min-height:3.2em;font-size:max(12px,calc(var(--u)*3.2));font-weight:600;margin:6px 0 2px;text-align:center}
.gctl{display:flex;justify-content:center;align-items:center;gap:10px;margin:4px 0}
.gdots{display:flex;gap:5px}.gdots i{width:7px;height:7px;border-radius:50%;background:rgba(27,34,54,.25)}.gdots i.on{background:#1B2236}
.gbtn{font-size:15px;min-width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(27,34,54,.35);background:rgba(255,255,255,.6);color:#1B2236}
.gins{display:block;width:100%;margin:6px 0;font-size:max(14px,calc(var(--u)*3.8));font-weight:800;padding:12px;border-radius:14px;background:#1B2236;color:#F4EFE6;border:0}
.gok{margin:6px 0;padding:10px;border-radius:12px;background:#DCE9E1;font-weight:700;text-align:center}
#nudge{position:fixed;z-index:12;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translate(-50%,30px);width:min(92vw,380px);background:#F4EFE6;color:#1B2236;border-radius:18px;padding:14px 16px;box-shadow:0 10px 34px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .5s,transform .5s}
#nudge.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#nudge b{display:block;font-size:15px;margin-bottom:3px}#nudge p{margin:0 0 10px;font-size:12.5px;opacity:.8}
#nudge .row{display:flex;gap:8px}#nudge button{flex:1;padding:11px;border-radius:12px;font-weight:800;font-size:13.5px;border:1.5px solid rgba(27,34,54,.35);background:rgba(255,255,255,.6);color:#1B2236}
#nudge button.pri{background:#1B2236;color:#F4EFE6;border-color:#1B2236}
#bshare.pulse{animation:bpl 1.8s ease-in-out infinite}
@keyframes bpl{50%{box-shadow:0 0 0 6px rgba(225,169,58,.45)}}
@media (prefers-reduced-motion:reduce){.gtgt,#bshare.pulse{animation:none}.gfg{transition:none}}
body.playing #nudge,body.pnl #nudge{display:none}
body.pnl #brand{opacity:0!important;pointer-events:none}
</style>

function updTrail(dt){

    p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
    var TD1=TRD[p.t];if(TD1){if(TD1.g)p.vy-=TD1.g*dt;if(TD1.fl)p.vx+=Math.sin(tm*(TD1.fq||4)+p.h*3)*TD1.fl*dt;if(TD1.bn&&p.y<p.fy+0.03){p.y=p.fy+0.03;p.vy=Math.abs(p.vy)*0.35;p.vx*=0.7;}a.push(p);continue;}
    if(p.t==="confetti"){p.vy-=9*dt;}else if(p.t==="sparks"){p.vy-=12*dt;}else if(p.t==="ice"){p.vy-=3*dt;}else if(p.t==="bubbles"){p.vx+=Math.sin(tm*4+p.h)*dt*1.5;}else if(p.t==="fire"){p.vy*=0.985;}

  '<p>Une boule roule sur des routes suspendues dans le vide. Évite les blocs (parfois mobiles), prends les rampes pour sauter par-dessus les trous, choisis ta route quand elle se sépare, traverse des tunnels, dévale des pentes (la vitesse change avec la pente), attrape les boosts verts et les super boosts dorés, et attention aux bords et aux monolithes qui tombent (ils se renversent en alternance, à gauche puis à droite). Les plaques orange sont des tremplins à bascule : roule dessus et ton avant se soulève d’un coup, pour une grande catapulte.</p>'+

  '<p><b>Bonus</b> : à la boutique, l’onglet Bonus propose 14 objets à usage unique (jusqu’à 9 de chaque) : Super boost, rockets, bouclier, seconde chance, fantôme, bélier, ralenti, pilote automatique, gravité lunaire, pièces ×2… Range-les dans « Mon équipement » (5 places, dans l’ordre voulu). En jeu, la flèche ↑ du clavier (ou Z) lance le suivant ; sur téléphone, touche le gros bouton rond. Le bouclier et la seconde chance s’activent tout seuls.</p>'+
  '<p><b>Commandes</b> : glisse le doigt à gauche ou à droite. Sur PC, uniquement les flèches : ← → pour se déplacer, ↑ pour lancer un bonus (la souris ne sert plus à jouer). Pause : Espace, P ou Échap sur PC ; trois doigts posés ensemble sur l’écran du téléphone.</p>'+

function updHard(){
  var done=function(){try{fetch(location.href.split("#")[0],{cache:"reload"}).catch(function(){}).then(function(){location.reload();});}catch(e){location.reload();}};
  try{
    Promise.all([("serviceWorker" in navigator)?navigator.serviceWorker.getRegistrations().then(function(a){return Promise.all(a.map(function(r){return r.unregister();}));}):0,
      window.caches?caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x);}));}):0]).then(done,done);
  }catch(e){done();}
}
function updCheck(man){
  var m=$("umsg"),out=function(t){if(man&&m&&document.body.contains(m))m.textContent=t;};
  if(UPD.reg){try{UPD.reg.update();}catch(e){}}

    fetch("sw.js?_="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){
      var q=/CACHE\s*=\s*"([^"]+)"/.exec(t),v=q?q[1]:"";

      else out("Le jeu est à jour (version "+CFG.version+").");
