<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Abel Run</title>
<meta name="description" content="Abel Run : jeu de course minimaliste en 3D. Glisse le doigt ou utilise les flèches du clavier.">
<meta name="theme-color" content="#1B2236">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abel Run">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--ink:#1B2236;--ink2:#27314D;--ivory:#EEE9DF;--haze:#DED6C8;--terra:#C4614A;--sage:#7E9C86;--slate:#34405C;--u:4px;
  --font:"Avenir Next","Helvetica Neue","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--ink);font-family:var(--font);
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#icv{z-index:7;pointer-events:none;transition:opacity .5s ease}
#veil{position:absolute;inset:0;background:var(--ivory);opacity:0;pointer-events:none;z-index:2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Logo permanent */
#brand{position:fixed;left:50%;z-index:9;pointer-events:none;opacity:0;
  top:calc(env(safe-area-inset-top,0px) + var(--u)*2.6);width:calc(var(--u)*30);transform:translateX(-50%);
  transition:top .6s cubic-bezier(.3,.8,.3,1),width .6s cubic-bezier(.3,.8,.3,1),opacity .6s ease}
#brand svg{display:block;width:100%;height:auto;overflow:visible}
#brand.on{opacity:1}
body.m-menu #brand{top:calc(env(safe-area-inset-top,0px) + var(--u)*9);width:calc(var(--u)*72)}

/* HUD */
#hud{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .5s ease}
#hud.on{opacity:1}
.sc{position:absolute;left:calc(var(--u)*5);top:calc(env(safe-area-inset-top,0px) + var(--u)*4);font-size:calc(var(--u)*10.5);font-weight:200;font-variant-numeric:tabular-nums;line-height:1}
.sc small{display:block;font-size:max(9px,calc(var(--u)*2.3));letter-spacing:.3em;text-transform:uppercase;opacity:.55;margin-top:calc(var(--u)*1.6);font-weight:700}
.lv{position:absolute;right:calc(var(--u)*5);top:calc(env(safe-area-inset-top,0px) + var(--u)*4.4);text-align:right;font-size:max(9px,calc(var(--u)*2.4));letter-spacing:.26em;text-transform:uppercase;font-weight:700;line-height:1.5}
.lv span{display:block;opacity:.55}
.dots{margin-top:calc(var(--u)*1.2)}
.dots i{display:inline-block;width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:50%;border:calc(var(--u)*.36) solid currentColor;margin-left:calc(var(--u)*1.1)}
.dots i.f{background:currentColor}
#cap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*16);text-align:center;font-size:max(10px,calc(var(--u)*3));letter-spacing:.34em;text-transform:uppercase;font-weight:700;opacity:0}
#cap.on{animation:cap 2s ease both}
@keyframes cap{0%{opacity:0;transform:translateY(6px)}14%{opacity:.85;transform:none}74%{opacity:.85}100%{opacity:0}}
.fix{position:fixed;z-index:9;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*3);height:calc(var(--u)*8.4);min-height:34px;padding:0 calc(var(--u)*3.2);border-radius:999px;border:1.5px solid rgba(27,34,54,.35);background:rgba(238,233,223,.7);color:var(--ink);font-size:max(11px,calc(var(--u)*3));font-weight:700;letter-spacing:.06em}
#bmute{left:calc(env(safe-area-inset-left,0px) + var(--u)*4)}
#bpause{right:calc(env(safe-area-inset-right,0px) + var(--u)*4);display:none}
body.playing #bpause{display:block}
body.intro .fix{background:rgba(238,233,223,.14);color:var(--ivory);border-color:rgba(238,233,223,.35)}

/* Écrans */
.screen{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2.8);
  padding:calc(env(safe-area-inset-top,0px) + var(--u)*14) calc(var(--u)*5) calc(env(safe-area-inset-bottom,0px) + var(--u)*14);
  text-align:center;opacity:0;pointer-events:none;transition:opacity .45s ease;overflow:auto}
.screen.on{opacity:1;pointer-events:auto}
#menu{padding-top:calc(env(safe-area-inset-top,0px) + var(--u)*31);justify-content:flex-start}
#panel{background:rgba(27,34,54,.55);z-index:8}
.sub{margin:0;font-size:max(11px,calc(var(--u)*3));letter-spacing:.38em;text-transform:uppercase;font-weight:700;opacity:.7}
.rec{display:flex;gap:calc(var(--u)*2);justify-content:center;flex-wrap:wrap}
.tile{min-width:calc(var(--u)*26);padding:calc(var(--u)*2) calc(var(--u)*2.4);border-radius:calc(var(--u)*3.4);background:rgba(238,233,223,.62);border:1.5px solid rgba(27,34,54,.16)}
.tile b{display:block;font-size:calc(var(--u)*6.4);font-weight:300;font-variant-numeric:tabular-nums}
.tile i{font-style:normal;font-size:max(9px,calc(var(--u)*2.3));letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.big{border:0;background:var(--ink);color:var(--ivory);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:max(15px,calc(var(--u)*4.6));
  padding:calc(var(--u)*2.8) calc(var(--u)*10);border-radius:999px;box-shadow:0 calc(var(--u)*.8) 0 #0d1220,0 calc(var(--u)*2.4) calc(var(--u)*5) rgba(27,34,54,.3)}
.big:active{transform:translateY(2px)}
.pill{font-size:max(11px,calc(var(--u)*3));font-weight:700;letter-spacing:.05em;padding:calc(var(--u)*1.6) calc(var(--u)*3.4);border-radius:999px;border:1.5px solid rgba(27,34,54,.35);background:rgba(238,233,223,.6)}
.pill.danger{border-color:#A33B2C;color:#8A2E21}
.row{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.8);justify-content:center}
.hint{margin:0;font-size:max(11px,calc(var(--u)*3));opacity:.75;max-width:calc(var(--u)*80)}
h2{margin:0;font-size:calc(var(--u)*7);font-weight:800;letter-spacing:.04em}
.badge{font-size:calc(var(--u)*3.6);font-weight:800;color:var(--terra);min-height:1.2em}
.bigscore{font-size:calc(var(--u)*17);font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.card{max-width:calc(var(--u)*100);width:100%;max-height:100%;overflow:auto;padding:calc(var(--u)*5);border-radius:calc(var(--u)*5);background:var(--ivory);color:var(--ink);text-align:left;line-height:1.5;
  font-size:max(13px,calc(var(--u)*3.4));-webkit-user-select:text;user-select:text;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card h2{font-size:calc(var(--u)*6)}
.card p,.card li{margin:calc(var(--u)*1.4) 0}
.card .rec,.card .row{justify-content:center}

/* Intro */
#skip{position:fixed;z-index:10;right:calc(env(safe-area-inset-right,0px) + var(--u)*4);bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*3);display:none}
body.intro #skip{display:block}
#upd{z-index:20;background:rgba(27,34,54,.7)}
#joy{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*4);width:calc(var(--u)*40);height:calc(var(--u)*1.2);margin-left:calc(var(--u)*-20);border-radius:99px;background:rgba(27,34,54,.18);z-index:8;display:none;pointer-events:none}
#joy i{position:absolute;top:50%;left:50%;width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);margin:calc(var(--u)*-1.8) 0 0 calc(var(--u)*-1.8);border-radius:50%;background:var(--ink)}

/* Palette v2.3 : bleus francs, textes clairs sur fond sombre */
body{color:var(--ivory)}
.screen{color:var(--ivory)}
.screen:not(#panel):not(#upd):not(#shop){background:linear-gradient(rgba(10,18,44,.52),rgba(10,18,44,.74))}
.sc,.lv,#cap{color:#F4EFE6;text-shadow:0 0 3px rgba(8,14,36,.95),0 0 7px rgba(8,14,36,.8),0 1px 10px rgba(8,14,36,.65)}
.fix{background:rgba(10,18,44,.62);color:#F4EFE6;border-color:rgba(244,239,230,.5)}
body.intro .fix{background:rgba(244,239,230,.14);border-color:rgba(244,239,230,.4)}
.tile{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3);color:#F4EFE6}
.pill{background:rgba(255,255,255,.12);border-color:rgba(244,239,230,.55);color:#F4EFE6}
.pill.danger{border-color:#E58A7A;color:#FFB4A6}
.big{background:#E2674C;color:#fff;box-shadow:0 calc(var(--u)*.8) 0 #9E3A27,0 calc(var(--u)*2.4) calc(var(--u)*5) rgba(8,14,36,.45)}
.hint{opacity:.9}
.card{color:#1B2236}
.card .pill{background:rgba(27,34,54,.07);color:#1B2236;border-color:rgba(27,34,54,.4)}
.card .pill.danger{color:#8A2E21;border-color:#A33B2C}
.card .tile{background:rgba(27,34,54,.07);color:#1B2236;border-color:rgba(27,34,54,.2)}
.card .big{color:#fff}
#joy{background:rgba(255,255,255,.3)}
#joy i{background:#F4EFE6}

/* ===== Accueil v2.6 : curseur de niveau, visage, gros bouton, menu sandwich ===== */
#menu{gap:calc(var(--u)*3.2);padding-top:calc(env(safe-area-inset-top,0px) + var(--u)*24);padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*12);justify-content:center;--tc:#9BCB3B;--tcd:#5F8A14;--tt:#1F3305;--tl:#C6EE74}
body.m-menu #brand{width:calc(var(--u)*62)}
#face{width:calc(var(--u)*28);height:calc(var(--u)*28);display:block;overflow:visible;filter:drop-shadow(0 calc(var(--u)*1) calc(var(--u)*1.6) rgba(0,0,0,.4))}
.lvhead{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.9)}
.lvk{margin:0;font-size:max(10px,calc(var(--u)*2.6));letter-spacing:.34em;text-transform:uppercase;font-weight:700;opacity:.85}
.lvname{margin:0;font-size:calc(var(--u)*11);font-weight:800;letter-spacing:.03em;line-height:1.05;color:var(--tl);text-shadow:0 2px 0 rgba(0,0,0,.28),0 0 calc(var(--u)*4) rgba(0,0,0,.4);transition:color .25s}
.lvd{margin:0;font-size:max(12px,calc(var(--u)*3.3));opacity:.95;min-height:1.35em;max-width:calc(var(--u)*84)}
.slw{width:calc(var(--u)*86);max-width:100%;--tw:calc(var(--u)*11);display:flex;flex-direction:column;gap:calc(var(--u)*1.2)}
.sl{position:relative;height:var(--tw)}
.sltrack{position:absolute;left:0;right:0;top:50%;height:calc(var(--u)*4.6);margin-top:calc(var(--u)*-2.3);border-radius:99px;border:calc(var(--u)*.55) solid rgba(255,255,255,.8);
  background:linear-gradient(90deg,#38C172 0%,#9BCB3B 25%,#F2B632 50%,#EC6A2C 75%,#8E1010 100%);box-shadow:0 calc(var(--u)*.6) calc(var(--u)*1.6) rgba(0,0,0,.4)}
.sltick{position:absolute;top:50%;width:calc(var(--u)*1.7);height:calc(var(--u)*1.7);margin:calc(var(--u)*-.85) 0 0 calc(var(--u)*-.85);border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 0 0 calc(var(--u)*.3) rgba(0,0,0,.35);pointer-events:none}
.sl input{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;touch-action:none;cursor:pointer;outline:none}
.sl input::-webkit-slider-runnable-track{height:var(--tw);background:transparent;border:0}
.sl input::-moz-range-track{height:var(--tw);background:transparent;border:0}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;box-sizing:border-box;width:var(--tw);height:var(--tw);border-radius:50%;background:var(--tc);border:calc(var(--u)*1.1) solid #fff;box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2) rgba(0,0,0,.5);transition:background .25s}
.sl input::-moz-range-thumb{box-sizing:border-box;width:var(--tw);height:var(--tw);border-radius:50%;background:var(--tc);border:calc(var(--u)*1.1) solid #fff;box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2) rgba(0,0,0,.5)}
.sl input:focus-visible::-webkit-slider-thumb{outline:3px solid #fff;outline-offset:3px}
.sl input:focus-visible::-moz-range-thumb{outline:3px solid #fff;outline-offset:3px}
.slends{display:flex;justify-content:space-between;font-size:max(10px,calc(var(--u)*2.5));letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.8;padding:0 calc(var(--u)*1)}
.play{width:calc(var(--u)*86);max-width:100%;border:0;border-radius:calc(var(--u)*10);padding:calc(var(--u)*5.6) 0;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*3.4);
  font-size:calc(var(--u)*10.5);font-weight:900;letter-spacing:.12em;text-transform:uppercase;line-height:1;background:var(--tc);color:var(--tt);
  box-shadow:0 calc(var(--u)*1.5) 0 var(--tcd),0 calc(var(--u)*3.6) calc(var(--u)*6) rgba(0,0,0,.45);transition:background .25s,box-shadow .25s,color .25s}
.play::before{content:"";width:0;height:0;border-style:solid;border-width:calc(var(--u)*4.4) 0 calc(var(--u)*4.4) calc(var(--u)*7.4);border-color:transparent transparent transparent currentColor}
.play:active{transform:translateY(calc(var(--u)*1));box-shadow:0 calc(var(--u)*.5) 0 var(--tcd),0 calc(var(--u)*1.6) calc(var(--u)*3) rgba(0,0,0,.4)}
.play:focus-visible{outline:3px solid #fff;outline-offset:4px}
.recl{margin:0;font-size:max(12px,calc(var(--u)*3.2));opacity:.9;font-variant-numeric:tabular-nums}
.mini{margin:0;font-size:max(10px,calc(var(--u)*2.6));opacity:.65;max-width:calc(var(--u)*80)}
#bburger{position:fixed;z-index:9;top:calc(env(safe-area-inset-top,0px) + var(--u)*3.4);right:calc(env(safe-area-inset-right,0px) + var(--u)*4);width:calc(var(--u)*11.5);height:calc(var(--u)*11.5);min-width:44px;min-height:44px;border-radius:50%;
  border:1.5px solid rgba(244,239,230,.55);background:rgba(10,18,44,.6);display:none;align-items:center;justify-content:center;flex-direction:column;gap:calc(var(--u)*1.3);padding:0}
body.m-menu #bburger{display:flex}
body.pnl #bburger{display:none}
#bburger i{display:block;width:calc(var(--u)*5.2);min-width:18px;height:calc(var(--u)*.75);min-height:2px;border-radius:2px;background:#F4EFE6;transition:transform .25s,opacity .2s}
#bburger[aria-expanded="true"] i:nth-child(1){transform:translateY(calc(var(--u)*2.05)) rotate(45deg)}
#bburger[aria-expanded="true"] i:nth-child(2){opacity:0}
#bburger[aria-expanded="true"] i:nth-child(3){transform:translateY(calc(var(--u)*-2.05)) rotate(-45deg)}
#drawer{position:fixed;inset:0;z-index:9;display:none;background:rgba(8,14,36,.4)}
#drawer.on{display:block}
#drawer .dbox{position:absolute;right:calc(env(safe-area-inset-right,0px) + var(--u)*4);top:calc(env(safe-area-inset-top,0px) + var(--u)*16.5);width:calc(var(--u)*68);max-width:calc(100vw - 32px);
  background:#F4EFE6;color:#1B2236;border-radius:calc(var(--u)*4);padding:calc(var(--u)*1.6);box-shadow:0 20px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;animation:drw .18s ease both}
@keyframes drw{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#drawer .dbox button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#1B2236;padding:calc(var(--u)*3.1) calc(var(--u)*3.4);border-radius:calc(var(--u)*2.8);font-size:max(14px,calc(var(--u)*3.7));font-weight:700;min-height:44px}
#drawer .dbox button:hover,#drawer .dbox button:active{background:rgba(27,34,54,.09)}
@media (prefers-reduced-motion:reduce){.play,.lvname,.sl input::-webkit-slider-thumb{transition:none}#drawer .dbox{animation:none}}

body.lt .sc,body.lt .lv,body.lt #cap{color:#1B2236;text-shadow:0 0 3px rgba(255,255,255,.95),0 0 8px rgba(255,255,255,.8),0 1px 10px rgba(255,255,255,.6)}
body.lt .sc small{opacity:.75}
/* ===== Boutique v2.7 ===== */
.coin{display:inline-block;flex:none;width:1.15em;height:1.15em;border-radius:50%;vertical-align:-.2em;background:radial-gradient(circle at 34% 28%,#FFF6BE,#F5C73A 55%,#B9860C);box-shadow:inset 0 0 0 .14em rgba(122,80,0,.6)}
#bshop{display:inline-flex;align-items:center;gap:calc(var(--u)*2.2);position:relative;padding:calc(var(--u)*2.2) calc(var(--u)*5);font-size:max(13px,calc(var(--u)*3.6));min-height:44px}
#bshop b{font-weight:800;letter-spacing:.12em;text-transform:uppercase}
#bshop .coin{font-size:calc(var(--u)*4.2)}
#bshopc{font-variant-numeric:tabular-nums;font-weight:800}
#bshopd{display:none;position:absolute;top:calc(var(--u)*-.6);right:calc(var(--u)*1.2);width:calc(var(--u)*3);height:calc(var(--u)*3);min-width:10px;min-height:10px;border-radius:50%;background:#E2674C;border:2px solid #F4EFE6}
.gain{font-size:max(14px,calc(var(--u)*4.4));font-weight:800;min-height:1.3em;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*1.6);color:#FFD36B}
.gain small{font-weight:600;color:#F4EFE6;opacity:.8;font-size:.78em}
#shop{padding:0;gap:0;justify-content:space-between;align-items:stretch;overflow:hidden;pointer-events:none;text-align:left;background:linear-gradient(rgba(8,14,36,.5),rgba(8,14,36,0) 24%)}
#shop .shtop,#shop .shsheet{pointer-events:none}
#shop.on .shtop,#shop.on .shsheet{pointer-events:auto}
.shtop{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*2);padding:calc(env(safe-area-inset-top,0px) + var(--u)*3.4) calc(env(safe-area-inset-right,0px) + var(--u)*4) 0 calc(env(safe-area-inset-left,0px) + var(--u)*4)}
.shtop .pill{min-height:44px;background:rgba(10,18,44,.62)}
.shcoins{display:flex;align-items:center;gap:calc(var(--u)*1.6);min-height:44px;padding:0 calc(var(--u)*4);border-radius:999px;border:1.5px solid rgba(244,239,230,.55);background:rgba(10,18,44,.62);font-weight:800;font-size:max(14px,calc(var(--u)*4));font-variant-numeric:tabular-nums}
.shsheet{align-self:center;width:100%;max-width:min(100%,calc(var(--u)*150));height:48%;display:flex;flex-direction:column;border-radius:calc(var(--u)*5) calc(var(--u)*5) 0 0;background:rgba(12,20,48,.93);border:1.5px solid rgba(244,239,230,.22);border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.35);padding-bottom:env(safe-area-inset-bottom,0px)}
.shtabs{display:flex;gap:calc(var(--u)*1.1);padding:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*1.6);overflow-x:auto;touch-action:pan-x;scrollbar-width:none;flex:none}
.shtabs::-webkit-scrollbar{display:none}
.shtab{flex:1 0 auto;border:1.5px solid rgba(244,239,230,.32);background:transparent;color:#F4EFE6;border-radius:999px;padding:0 calc(var(--u)*2.2);min-height:40px;font-weight:700;font-size:max(11px,calc(var(--u)*3));letter-spacing:.02em;white-space:nowrap}
.shtab.on{background:#F4EFE6;color:#14204A;border-color:#F4EFE6}
.shgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*21),1fr));gap:calc(var(--u)*2);padding:calc(var(--u)*1.6) calc(var(--u)*4) calc(var(--u)*2.4);overflow-y:auto;touch-action:pan-y;flex:1 1 auto;min-height:0;overscroll-behavior:contain;align-content:start;grid-auto-rows:max-content}
@media (max-height:700px){.shsheet{height:54%}}
.shc{position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.7);padding:calc(var(--u)*1.4) calc(var(--u)*.8);border-radius:calc(var(--u)*3);border:1.5px solid rgba(244,239,230,.2);background:rgba(255,255,255,.07);color:#F4EFE6;min-height:44px;font-size:max(10px,calc(var(--u)*2.5))}
.shc.sel{border-color:#FFD36B;background:rgba(255,211,107,.15);box-shadow:0 0 0 2px rgba(255,211,107,.35)}

    if(q.x<q.r){q.x=q.r;q.vx=-q.vx*0.7;}if(q.x>W-q.r){q.x=W-q.r;q.vx=-q.vx*0.7;}

  // traits et lettres

  for(i=0;i<iL.items.length;i++){
    it=iL.items[i];var t0=T_L0+T_LS*it.idx,col=it.col?"#D9806A":"#EEE9DF",hi=it.col?"#F1B3A0":"#FFFFFF";
    for(j=0;j<it.st.length;j++){
      s=it.st[j];
      if(t>=T_BURST&&t<t0){ // trait qui part du centre
        var fp=e3(clamp((t-T_BURST)/(t0-T_BURST),0,1)),tp=e3(clamp((t-T_BURST-0.12)/(t0-T_BURST),0,1));
        var hx=lerp(iL.cx,s.pts[0][0],fp),hy=lerp(iL.cy,s.pts[0][1],fp),tx2=lerp(iL.cx,s.pts[0][0],tp),ty2=lerp(iL.cy,s.pts[0][1],tp);
        c.strokeStyle="rgba(238,233,223,.75)";c.lineWidth=Math.max(1.5,H*0.03);c.beginPath();c.moveTo(tx2,ty2);c.lineTo(hx,hy);c.stroke();
        c.fillStyle="#fff";c.beginPath();c.arc(hx,hy,Math.max(2,H*0.035),0,6.2832);c.fill();
      }
      var dur=s.len/(SPEEDK*H),fr=clamp((t-t0)/dur,0,1);

        c.strokeStyle=col;c.lineWidth=iL.lw;var head=strokeTo(c,s,fr);
        c.save();c.translate(-H*0.035,-H*0.035);c.strokeStyle=hi;c.globalAlpha=0.5;c.lineWidth=iL.lw*0.24;strokeTo(c,s,fr);c.restore();
        if(fr<1&&Math.random()<0.7)iParts.push({x:head[0],y:head[1],vx:rnd(-1,1)*H*1.4,vy:rnd(-1,1)*H*1.4,r:rnd(0.03,0.07)*H+1,sp:it.col?1:0,life:1,tag:1});

  }

  if(TAG&&t>T_BALL-0.1){
    var ta=clamp((t-(T_BALL-0.1))/0.5,0,1)*(1-clamp((t-T_FLOOD)/0.4,0,1));

    var sz=Math.max(10,H*0.17),sp=sz*0.5,wTot=0,k2;for(k2=0;k2<TAG.length;k2++)wTot+=c.measureText(TAG.charAt(k2)).width+sp;

  if(t>=T_FLOOD-0.8&&!started){started=true;startDemo();camExtra=1;}
  if(t>=T_FADE&&!iL.fading){iL.fading=true;icv.style.opacity="0";setTimeout(function(){if(mode!=="intro")icv.style.display="none";},800);}

}

var CLOSE='<p style="text-align:center"><button class="pill" id="pclose" type="button">Fermer</button></p>';
function panelAbout(){
  openPanel('<h2>À propos</h2><p><b>Abel Run</b> — version '+CFG.version+'.</p>'+
  '<p>Une boule roule sur des routes suspendues dans le vide. Évite les blocs (parfois mobiles), prends les rampes pour sauter par-dessus les trous, choisis ta route quand elle se sépare, traverse des tunnels, dévale des pentes (la vitesse change avec la pente), attrape les boosts verts et les super boosts dorés, et attention aux bords et aux monolithes qui tombent (ils se renversent en alternance, à gauche puis à droite). Les plaques orange sont des tremplins à bascule : roule dessus et ton avant se soulève d’un coup, pour une grande catapulte.</p>'+
  '<p>Cinq niveaux de vitesse : Détente, Balade, Course, Vertige, Folie. Plus tu vas vite, plus une rampe te lance loin. Les scores sont gardés par niveau : meilleur du jour, de la semaine et record.</p>'+
  '<p><b>Boutique</b> : à la fin de chaque partie tu gagnes des pièces selon la distance parcourue (davantage aux niveaux élevés). Dépense-les pour changer la couleur et le motif de la bille, ses traînées, la couleur de la piste, et même l’univers entier : Route 66 au départ, puis néon, forêt, neige, ville la nuit, océan, lave, espace et route arc-en-ciel. Rien ne s’achète avec de l’argent réel.</p>'+
  '<p><b>Commandes</b> : glisse le doigt à gauche ou à droite, ou touches ← → (ou Q / D). Sur PC, bouton « Commande PC » : souris / pavé tactile (le centre de l’écran est le point neutre, un petit mouvement suffit) ou flèches. Pause : Espace, P ou Échap sur PC ; trois doigts posés ensemble sur l’écran du téléphone.</p>'+
  '<p>Créé par Tom Rougeaud. Licence CC BY-NC 4.0 (partage et adaptation libres, usage non commercial, avec mention de l’auteur). Les sons sont générés dans la page, sans fichier audio.</p>'+
  '<p>Tout tient dans une seule page : aucune bibliothèque externe, et le jeu fonctionne hors connexion une fois installé.</p>'+CLOSE);
}
function panelPriv(){
  openPanel('<h2>Confidentialité</h2><ul>'+
  '<li>Aucune donnée n’est envoyée par le jeu : pas de compte, pas de cookie, pas de traceur, pas de service externe.</li>'+
  '<li>Tes scores (date, niveau, points), ton niveau préféré, tes pièces et tes achats de la boutique sont enregistrés uniquement dans ton navigateur, sur cet appareil.</li>'+
  '<li>Tu peux exporter, importer ou effacer tes scores et ta boutique à tout moment depuis « Mes scores ». La boutique n’utilise aucun paiement : les pièces se gagnent seulement en jouant.</li>'+
  '<li>Si le stockage local est bloqué (navigation privée par exemple), les scores ne durent que le temps de la page.</li>'+
  '<li>Le site est hébergé sur GitHub Pages : l’hébergeur peut garder des journaux techniques d’accès, indépendamment du jeu.</li></ul>'+CLOSE);
}
function panelData(){
  var t="";for(var i=0;i<LV.length;i++)t+='<p><b>'+LV[i].n+'</b></p><div class="rec">'+tilesHTML(bests(i))+'</div>';
  openPanel('<h2>Mes scores</h2>'+t+'<p>Sauvegarde tes scores, tes pièces et tes achats dans un fichier, ou récupère-les sur un autre appareil.</p>'+
  '<p class="row"><button class="pill" id="bexp" type="button">Exporter</button><button class="pill" id="bimp" type="button">Importer</button><button class="pill danger" id="bclr" type="button">Effacer les scores</button><button class="pill danger" id="bclr2" type="button">Remise à zéro de la boutique</button></p>'+
  '<p id="dmsg" class="hint" style="max-width:none;text-align:center"></p><input type="file" id="fimp" accept=".json,application/json" style="display:none">'+CLOSE);
  $("bexp").onclick=exportData;$("bimp").onclick=function(){$("fimp").click();};
  $("fimp").onchange=function(e){importData(e.target.files&&e.target.files[0]);};
  var armed=false,armed2=false;
  $("bclr2").onclick=function(){
    if(!armed2){armed2=true;$("bclr2").textContent="Confirmer la remise à zéro";$("dmsg").textContent="Appuie encore une fois pour remettre la boutique à zéro : pièces et achats seront perdus.";return;}
    sDel("shop");SD=loadShop();PV=null;applyCosm();startDemo();updCoinsUI();panelData();$("dmsg").textContent="Boutique remise à zéro.";
  };
  $("bclr").onclick=function(){
    if(!armed){armed=true;$("bclr").textContent="Confirmer l’effacement";$("dmsg").textContent="Appuie encore une fois pour effacer tous les scores de cet appareil.";return;}
    sDel("runs");for(var i=0;i<LV.length;i++)sDel("best"+i);setLvlUI();panelData();$("dmsg").textContent="Scores effacés.";
  };
}
function exportData(){
  try{
    var best=[];for(var i=0;i<LV.length;i++)best.push(bests(i).all);
    var blob=new Blob([JSON.stringify({app:"abel-run",version:2,best:best,runs:loadRuns(),shop:{coins:SD.coins,own:SD.own,eq:SD.eq}},null,1)],{type:"application/json"});
    var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="abel-run-scores.json";document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);$("dmsg").textContent="Fichier exporté.";
  }catch(e){$("dmsg").textContent="Export impossible sur cet appareil.";}
}
function importData(file){
  if(!file)return;var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);if(!d||d.app!=="abel-run"||!Array.isArray(d.runs))throw new Error("format");
      var seen={},out=[];
      loadRuns().concat(d.runs.filter(validRun)).forEach(function(r){var k=r.t+"_"+r.l+"_"+r.s;if(!seen[k]){seen[k]=1;out.push({s:Math.floor(r.s),t:r.t,l:r.l});}});
      out.sort(function(a,b){return a.t-b.t;});saveRuns(out);
      if(Array.isArray(d.best))for(var i=0;i<LV.length;i++){var v=Math.floor(+d.best[i]||0);if(v>(parseInt(sGet("best"+i)||"0",10)||0))sSet("best"+i,String(v));}
      if(d.shop&&typeof d.shop==="object"){var sj=d.shop,key,k2,id2,c2=Math.max(0,Math.floor(+sj.coins||0));
        if(isFinite(c2)&&c2>SD.coins)SD.coins=c2;
        if(sj.own&&typeof sj.own==="object")for(key in sj.own){var q2=key.split(":");if(q2.length===2&&findItem(q2[0],q2[1]))SD.own[key]=1;}
        if(sj.eq&&typeof sj.eq==="object")for(k2 in DEF){id2=sj.eq[k2];if(typeof id2==="string"&&findItem(k2,id2)&&isOwn(k2,id2))SD.eq[k2]=id2;}
        saveShop();PV=null;if(applyCosm())startDemo();updCoinsUI();}
      setLvlUI();panelData();$("dmsg").textContent="Import réussi.";
    }catch(e){$("dmsg").textContent="Fichier non valide.";}
  };
  rd.onerror=function(){$("dmsg").textContent="Lecture impossible.";};rd.readAsText(file);
}

var last=performance.now(),acc=0,rdt=1/60;
function frame(now){
  requestAnimationFrame(frame);
  var raw=(now-last)/1000,dt=Math.min(0.1,Math.max(0,raw));last=now;
  if(mode==="play"&&!perfLow&&raw>0&&raw<0.2){perfEma+=(raw-perfEma)*0.04;if(perfEma>0.031)perfBad++;else if(perfBad>0)perfBad--;if(perfBad>150){perfLow=true;if(qual==="auto")resize();}}
  if(mode==="intro"){var idt=Math.min(0.05,Math.max(0,(now-introLast)/1000));introLast=now;introFrame((now-introT0)/1000,idt);}
  acc+=dt;var n=0,h=1/60;
  while(acc>=h&&n<6){
    if(mode==="play")updatePlay(h);
    else if(mode==="crash"||mode==="fall")updateEnd(h);
    else if(mode==="menu"||mode==="intro"||mode==="shop"){if(started)updateDemo(h);}
    updFx(h);acc-=h;n++;
  }
  if(n>=6)acc=0;
  if(mode==="menu")faceTick(dt);
  rdt=dt;if(started||mode!=="intro")render();
}
makeSprites();buildBrand();buildSlider();setLvlUI(true);updMute();updCtl();updQual();updCoinsUI();
resize();
window.addEventListener("resize",resize);
if("ResizeObserver" in window){}
if(isStandalone())$("binstall").style.display="none";
try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  var hadCtl=!!navigator.serviceWorker.controller,reloading=false;
  var showUpd=function(w){var u=$("upd");u.classList.add("on");$("bupd").onclick=function(){$("bupd").textContent="Mise à jour…";try{w.postMessage("SKIP_WAITING");}catch(e){}setTimeout(function(){location.reload();},1500);};};
  navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadCtl&&!reloading){reloading=true;location.reload();}});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(reg){
    var watch=function(w){w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller)showUpd(w);});};
    if(reg.waiting&&navigator.serviceWorker.controller)showUpd(reg.waiting);
    reg.addEventListener("updatefound",function(){if(reg.installing)watch(reg.installing);});
    document.addEventListener("visibilitychange",function(){if(!document.hidden)try{reg.update();}catch(e){}});
    setInterval(function(){try{reg.update();}catch(e){}},600000);
  }).catch(function(){});
}}catch(e){}
applyCosm();startDemo();setBody();
if(window.__ABEL_TEST){window.__ABEL_TEST({
  newGame:function(l){lvl=l;resetWorld(false);newBall();tx=0;speed=LV[lvl].v*0.5;tm=0;boostT=0;bonus=0;said={};parts=[];shake=0;mode="play";ensureWorld();},
  step:function(dt){updatePlay(dt);},render:render,introFrame:introFrame,
  setTx:function(v){tx=v;},world:function(){return {chunks:chunks,cubes:cubes,pads:pads,B:B,mode:mode,speed:speed,G:G,tm:tm,cause:cause,monoPts:monoPts};},
  pos:function(z){B.z=z;},genN:function(l,n){lvl=l;resetWorld(false);newBall();for(var q=0;q<n;q++)nextSection();return {chunks:chunks,cubes:cubes,G:G};},size:function(w,h){SW=w;SH=h;F=Math.min(1.12*SW,0.9*SH);CY0=SH*0.36;CY=CY0;layoutIntro();},
  force:function(name,arg,d){resetWorld(false);newBall();tx=0;G.n=5;speed=LV[lvl].v;tm=0;puffs=[];mode="play";if(name==="jump")secJump(d,arg);else if(name==="multi")secMulti(d);else if(name==="frag")secFrag(d);else if(name==="winding")secWinding(d);else if(name==="zig")secZig(d);else if(name==="hills")secHills(d);else if(name==="bridge")secBridge(30,d);else if(name==="rows"){for(var q=0;q<6;q++)secRows(30,d,q%2===1);}else if(name==="chain")secChain(d);else if(name==="dip")secDip(d);else if(name==="tunnel")secTunnel(d,30);else if(name==="mono")secMono(d,30);else if(name==="super")secSuper(d);else if(name==="kick")secKick(d,30);tagExt(0);ensureWorld();},
  cam:function(){var q=P(B.x,B.y,B.z);return {camX:camX,camXs:camXs,bx:B.x,sx:q?q[0]/SW:-1,ax:render.ax,cx:render.cx,lk:render.lk,u:render.u,fl:render.fl,fol:render.fol,camY:camY,camZ:camZ};},
  kickD:kickD,
  cosm:function(o){var k;for(k in o){if(k==="force")continue;SD.own[k+":"+o[k]]=1;SD.eq[k]=o[k];}PV=null;var ch=applyCosm();if(ch||o.force)startDemo();return ch;},
  shopState:function(){return {SD:SD,CATS:CATS,WORLDS:WORLDS,mode:mode,shopT:shopT,qual:qual,perfLow:perfLow,props:props.length,trail:trail.length};},
  openShop:openShop,closeShop:closeShop,setTab:setTab,selectItem:selectItem,buySel:buySel,setCoins:function(n){SD.coins=n;saveShop();updCoinsUI();if(mode==="shop")renderShop();},
  setMode:function(m){mode=m;setBody();},finishNow:function(){finish();},giveCoins:giveCoins,coinsFor:coinsFor,
  setRdt:function(v){rdt=v;},
  stepD:function(dt){if(mode==="play")updatePlay(dt);else updateDemo(dt);updFx(dt);},
  ballY:function(){var q=P(B.x,B.y,B.z);return q?q[1]/SH:-1;},
  groundAt:groundAt,demo:function(){startDemo();mode="menu";started=true;},stepDemo:updateDemo,burst:function(){return iParts.length;}
});}
else{introT0=performance.now();introLast=introT0;requestAnimationFrame(frame);}
})();
