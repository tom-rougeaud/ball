<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Abel Run</title>
<meta name="description" content="Abel Run : jeu de course minimaliste en 3D. Glisse le doigt ou utilise les flèches du clavier.">
<meta name="theme-color" content="#1B2236">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abel Run">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--ink:#1B2236;--ink2:#27314D;--ivory:#EEE9DF;--haze:#DED6C8;--terra:#C4614A;--sage:#7E9C86;--slate:#34405C;--u:4px;
  --font:"Avenir Next","Helvetica Neue","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--ink);font-family:var(--font);
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#icv{z-index:7;pointer-events:none;transition:opacity .5s ease}
#veil{position:absolute;inset:0;background:var(--ivory);opacity:0;pointer-events:none;z-index:2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Logo permanent */
#brand{position:fixed;left:50%;z-index:9;pointer-events:none;opacity:0;
  top:calc(env(safe-area-inset-top,0px) + var(--u)*2.6);width:calc(var(--u)*30);transform:translateX(-50%);
  transition:top .6s cubic-bezier(.3,.8,.3,1),width .6s cubic-bezier(.3,.8,.3,1),opacity .6s ease}
#brand svg{display:block;width:100%;height:auto;overflow:visible}
#brand.on{opacity:1}
body.m-menu #brand{top:calc(env(safe-area-inset-top,0px) + var(--u)*9);width:calc(var(--u)*72)}

/* HUD */
#hud{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .5s ease}
#hud.on{opacity:1}
.sc{position:absolute;left:calc(var(--u)*5);top:calc(env(safe-area-inset-top,0px) + var(--u)*4);font-size:calc(var(--u)*10.5);font-weight:200;font-variant-numeric:tabular-nums;line-height:1}
.sc small{display:block;font-size:max(9px,calc(var(--u)*2.3));letter-spacing:.3em;text-transform:uppercase;opacity:.55;margin-top:calc(var(--u)*1.6);font-weight:700}
.lv{position:absolute;right:calc(var(--u)*5);top:calc(env(safe-area-inset-top,0px) + var(--u)*4.4);text-align:right;font-size:max(9px,calc(var(--u)*2.4));letter-spacing:.26em;text-transform:uppercase;font-weight:700;line-height:1.5}
.lv span{display:block;opacity:.55}
.dots{margin-top:calc(var(--u)*1.2)}
.dots i{display:inline-block;width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:50%;border:calc(var(--u)*.36) solid currentColor;margin-left:calc(var(--u)*1.1)}
.dots i.f{background:currentColor}
#cap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*16);text-align:center;font-size:max(10px,calc(var(--u)*3));letter-spacing:.34em;text-transform:uppercase;font-weight:700;opacity:0}
#cap.on{animation:cap 2s ease both}
@keyframes cap{0%{opacity:0;transform:translateY(6px)}14%{opacity:.85;transform:none}74%{opacity:.85}100%{opacity:0}}
.fix{position:fixed;z-index:9;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*3);height:calc(var(--u)*8.4);min-height:34px;padding:0 calc(var(--u)*3.2);border-radius:999px;border:1.5px solid rgba(27,34,54,.35);background:rgba(238,233,223,.7);color:var(--ink);font-size:max(11px,calc(var(--u)*3));font-weight:700;letter-spacing:.06em}
#bmute{left:calc(env(safe-area-inset-left,0px) + var(--u)*4)}
#bpause{right:calc(env(safe-area-inset-right,0px) + var(--u)*4);display:none}
body.playing #bpause{display:block}
body.intro .fix{background:rgba(238,233,223,.14);color:var(--ivory);border-color:rgba(238,233,223,.35)}

/* Écrans */
.screen{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2.8);
  padding:calc(env(safe-area-inset-top,0px) + var(--u)*14) calc(var(--u)*5) calc(env(safe-area-inset-bottom,0px) + var(--u)*14);
  text-align:center;opacity:0;pointer-events:none;transition:opacity .45s ease;overflow:auto}
.screen.on{opacity:1;pointer-events:auto}
#menu{padding-top:calc(env(safe-area-inset-top,0px) + var(--u)*31);justify-content:flex-start}
#panel{background:rgba(27,34,54,.55);z-index:8}
.sub{margin:0;font-size:max(11px,calc(var(--u)*3));letter-spacing:.38em;text-transform:uppercase;font-weight:700;opacity:.7}
.lvls{display:flex;gap:calc(var(--u)*2);width:calc(var(--u)*88);max-width:100%}
.lvb{flex:1;min-width:0;border:1.5px solid rgba(27,34,54,.3);background:rgba(238,233,223,.5);border-radius:calc(var(--u)*3.4);padding:calc(var(--u)*2) calc(var(--u)*1);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.8)}
.lvb b{font-size:max(11px,calc(var(--u)*3.3));letter-spacing:.06em}
.lvb span{font-size:max(9px,calc(var(--u)*2.5));opacity:.65}
.lvb[aria-pressed="true"]{background:var(--ink);color:var(--ivory);border-color:var(--ink)}
.rec{display:flex;gap:calc(var(--u)*2);justify-content:center;flex-wrap:wrap}
.tile{min-width:calc(var(--u)*26);padding:calc(var(--u)*2) calc(var(--u)*2.4);border-radius:calc(var(--u)*3.4);background:rgba(238,233,223,.62);border:1.5px solid rgba(27,34,54,.16)}
.tile b{display:block;font-size:calc(var(--u)*6.4);font-weight:300;font-variant-numeric:tabular-nums}
.tile i{font-style:normal;font-size:max(9px,calc(var(--u)*2.3));letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.big{border:0;background:var(--ink);color:var(--ivory);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:max(15px,calc(var(--u)*4.6));
  padding:calc(var(--u)*2.8) calc(var(--u)*10);border-radius:999px;box-shadow:0 calc(var(--u)*.8) 0 #0d1220,0 calc(var(--u)*2.4) calc(var(--u)*5) rgba(27,34,54,.3)}
.big:active{transform:translateY(2px)}
.pill{font-size:max(11px,calc(var(--u)*3));font-weight:700;letter-spacing:.05em;padding:calc(var(--u)*1.6) calc(var(--u)*3.4);border-radius:999px;border:1.5px solid rgba(27,34,54,.35);background:rgba(238,233,223,.6)}
.pill.danger{border-color:#A33B2C;color:#8A2E21}
.row{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.8);justify-content:center}
.hint{margin:0;font-size:max(11px,calc(var(--u)*3));opacity:.75;max-width:calc(var(--u)*80)}
h2{margin:0;font-size:calc(var(--u)*7);font-weight:800;letter-spacing:.04em}
.badge{font-size:calc(var(--u)*3.6);font-weight:800;color:var(--terra);min-height:1.2em}
.bigscore{font-size:calc(var(--u)*17);font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.card{max-width:calc(var(--u)*100);width:100%;max-height:100%;overflow:auto;padding:calc(var(--u)*5);border-radius:calc(var(--u)*5);background:var(--ivory);color:var(--ink);text-align:left;line-height:1.5;
  font-size:max(13px,calc(var(--u)*3.4));-webkit-user-select:text;user-select:text;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card h2{font-size:calc(var(--u)*6)}
.card p,.card li{margin:calc(var(--u)*1.4) 0}
.card .rec,.card .row{justify-content:center}

/* Intro */
#skip{position:fixed;z-index:10;right:calc(env(safe-area-inset-right,0px) + var(--u)*4);bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*3);display:none}
body.intro #skip{display:block}
#joy{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*4);width:calc(var(--u)*40);height:calc(var(--u)*1.2);margin-left:calc(var(--u)*-20);border-radius:99px;background:rgba(27,34,54,.18);z-index:8;display:none;pointer-events:none}
#joy i{position:absolute;top:50%;left:50%;width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);margin:calc(var(--u)*-1.8) 0 0 calc(var(--u)*-1.8);border-radius:50%;background:var(--ink)}
#sndhint{position:fixed;z-index:10;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*14);text-align:center;color:var(--ivory);font-size:max(11px,calc(var(--u)*2.8));letter-spacing:.3em;text-transform:uppercase;opacity:0;pointer-events:none}
body.intro #sndhint{opacity:.7}
#sndhint.gone{opacity:0!important}
</style>
</head>
<body class="intro">
<noscript>Abel Run a besoin de JavaScript pour fonctionner.</noscript>
<div id="app">
  <canvas id="game" aria-label="Zone de jeu Abel Run"></canvas>
  <div id="veil"></div>
  <div id="hud">
    <div class="sc"><span id="scv">0</span><small>mètres</small></div>
    <div class="lv"><span>Niveau</span><b id="lvn">Course</b><div class="dots" id="dots"></div></div>
    <div id="cap"></div>
  </div>

  <div id="menu" class="screen">
    <p class="sub">Roule · Évite · Décolle</p>
    <div class="lvls" id="lvls" role="group" aria-label="Niveau"></div>
    <div class="rec" id="rec"></div>
    <button class="big" id="bplay" type="button">Jouer</button>
    <p class="hint">Glisse le doigt à gauche ou à droite. Au pavé tactile : pose le doigt au centre, puis pousse un peu à gauche ou à droite, comme un joystick. Au clavier : flèches ← →.</p>
    <button class="pill" id="binstall" type="button">Installer sur l’écran d’accueil</button>
    <div class="row">
      <button class="pill" id="bdata" type="button">Scores</button>
      <button class="pill" id="babout" type="button">À propos</button>
      <button class="pill" id="bpriv" type="button">Confidentialité</button>
      <button class="pill" id="bintro" type="button">Revoir l’intro</button>
    </div>
  </div>

  <div id="pause" class="screen">
    <h2>Pause</h2>
    <button class="big" id="bresume" type="button">Reprendre</button>

  </div>

  <div id="over" class="screen">

    <div class="rec" id="ovr"></div>
    <button class="big" id="bagain" type="button">Rejouer</button>
    <button class="pill" id="bmenu" type="button">Menu</button>
  </div>

  <div id="panel" class="screen"><div class="card" id="pcard"></div></div>
  <canvas id="icv"></canvas>
</div>

<div id="brand" role="img" aria-label="Abel Run"></div>
<button class="fix" id="bmute" type="button" aria-label="Activer ou couper le son">♪ Son</button>
<button class="fix" id="bpause" type="button">Pause</button>
<button class="pill" id="skip" type="button">Passer</button>
<div id="joy" aria-hidden="true"><i></i></div>
<div id="sndhint">Touche l’écran pour le son</div>

<script type="application/json" id="cfg">
{"version":"2.0","prefix":"abelrun_v2_","ballR":0.5,"gravity":24,"keySpeed":13,
 "levels":[{"n":"Balade","v":24},{"n":"Course","v":32},{"n":"Vertige","v":42}],
 "texts":{"tagline":"Glisse · Évite · Décolle"}}
</script>

<script>
(function(){
"use strict";
function $(i){return document.getElementById(i);}
var CFG=JSON.parse($("cfg").textContent),LV=CFG.levels,TAG=CFG.texts.tagline;
var app=$("app"),cv=$("game"),ctx=cv.getContext("2d"),icv=$("icv"),ictx=icv.getContext("2d");
var PI=Math.PI;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rnd(a,b){return a+Math.random()*(b-a);}
function e3(t){return 1-Math.pow(1-t,3);}

/* ---------- stockage (try/catch + repli mémoire) ---------- */
var PFX=CFG.prefix,mem={};
function sGet(k){try{var v=window.localStorage.getItem(PFX+k);if(v!==null)return v;}catch(e){}return (k in mem)?mem[k]:null;}
function sSet(k,v){mem[k]=v;try{window.localStorage.setItem(PFX+k,v);}catch(e){}}
function sDel(k){delete mem[k];try{window.localStorage.removeItem(PFX+k);}catch(e){}}
function validRun(r){return r&&typeof r.s==="number"&&isFinite(r.s)&&r.s>=0&&typeof r.t==="number"&&isFinite(r.t)&&typeof r.l==="number"&&r.l>=0&&r.l<LV.length;}
function loadRuns(){try{var a=JSON.parse(sGet("runs")||"[]");return Array.isArray(a)?a.filter(validRun):[];}catch(e){return [];}}
function saveRuns(a){sSet("runs",JSON.stringify(a.slice(-600)));}
function dayStart(){var d=new Date();d.setHours(0,0,0,0);return d.getTime();}
function weekStart(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}
function bests(l){
  var ds=dayStart(),ws=weekStart(),b={day:0,week:0,all:parseInt(sGet("best"+l)||"0",10)||0};
  loadRuns().forEach(function(r){if(r.l!==l)return;if(r.s>b.all)b.all=r.s;if(r.t>=ws&&r.s>b.week)b.week=r.s;if(r.t>=ds&&r.s>b.day)b.day=r.s;});
  return b;
}
function addRun(s,l){
  var a=loadRuns();a.push({s:s,t:Date.now(),l:l});saveRuns(a);
  var b=parseInt(sGet("best"+l)||"0",10)||0;if(s>b)sSet("best"+l,String(s));
}
function tilesHTML(b){
  return '<div class="tile"><b>'+b.day+'</b><i>Aujourd’hui</i></div><div class="tile"><b>'+b.week+'</b><i>Cette semaine</i></div><div class="tile"><b>'+b.all+'</b><i>Record</i></div>';
}

/* ---------- son : effets + musique 8 bits ---------- */
var AC=null,master=null,musG=null,sfxG=null,P25=null,P125=null,noiseBuf=null;
var muted=sGet("mute")==="1",musicOn=false,seq={step:0,next:0,timer:null};
var LEAD=[
 [69,0,72,0,76,0,72,0,69,0,64,0,69,72,76,0],[65,0,69,0,72,0,69,0,65,0,60,0,65,69,72,0],
 [72,0,76,0,79,0,76,0,72,0,67,0,72,76,79,0],[67,0,71,0,74,0,71,0,67,0,62,0,67,71,74,71],
 [76,0,76,72,0,72,69,0,69,72,0,76,81,0,76,0],[77,0,77,72,0,72,69,0,69,72,0,77,81,0,77,0],
 [79,0,79,76,0,76,72,0,72,76,0,79,84,0,79,0],[79,0,79,74,0,74,71,0,71,74,0,79,83,0,79,74]];
var ROOT=[45,41,48,43],CHORD=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]];
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function pulseWave(d){var n=32,re=new Float32Array(n),im=new Float32Array(n);for(var k=1;k<n;k++)re[k]=2/(k*PI)*Math.sin(k*PI*d);return AC.createPeriodicWave(re,im);}
function unlock(){
  if(!AC){
    try{
      var C=window.AudioContext||window.webkitAudioContext;AC=new C();
      master=AC.createGain();master.gain.value=muted?0:0.9;master.connect(AC.destination);
      musG=AC.createGain();musG.gain.value=0.15;musG.connect(master);
      sfxG=AC.createGain();sfxG.gain.value=0.5;sfxG.connect(master);
      P25=pulseWave(0.25);P125=pulseWave(0.125);
      noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }catch(e){AC=null;return;}
  }
  try{if(AC.state==="suspended")AC.resume();}catch(e){}
  startMusic();$("sndhint").classList.add("gone");
}
function voice(wave,f,t,dur,vol){
  var o=AC.createOscillator(),g=AC.createGain();
  if(wave==="tri")o.type="triangle";else o.setPeriodicWave(wave);
  o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.006);
  g.gain.setValueAtTime(vol,t+dur*0.6);g.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(musG);o.start(t);o.stop(t+dur+0.03);
}
function noiseHit(t,dur,vol,hp){
  var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type="highpass";f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(musG);s.start(t);s.stop(t+dur+0.02);
}
function kick(t){
  var o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);
  g.gain.setValueAtTime(0.9,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.16);o.connect(g);g.connect(musG);o.start(t);o.stop(t+0.18);
}
function schedule(){
  if(!AC||!musicOn)return;
  var guard=0;
  while(seq.next<AC.currentTime+0.2&&guard++<8){
    var s=seq.step,bar=(s>>4)%8,st=s&15,t=seq.next,ci=bar%4,m=LEAD[bar][st];
    if(m)voice(P25,mtof(m),t,0.09,0.5);
    if(st%2===0)voice("tri",mtof(ROOT[ci]+(st%4===2?12:0)),t,0.19,0.9);
    if(bar>=4&&st%2===1)voice(P125,mtof(CHORD[ci][(st>>1)%3]+12),t,0.07,0.22);
    if(st===0||st===8||(st===10&&bar%2===1))kick(t);
    if(st===4||st===12)noiseHit(t,0.1,0.35,1800);
    if(st%2===0)noiseHit(t,0.03,0.12,7000);
    seq.next+=0.1;seq.step++;
  }
}
function startMusic(){if(!AC||musicOn)return;musicOn=true;seq.next=AC.currentTime+0.1;seq.step=0;seq.timer=setInterval(schedule,40);}
function sfx(f1,f2,dur,type,vol){
  if(!AC||muted)return;
  try{var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||"square";
    o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+dur+0.02);}catch(e){}
}
function updMute(){$("bmute").textContent=muted?"♪ Muet":"♪ Son";if(master)master.gain.value=muted?0:0.9;}
function musicLevel(){if(musG)musG.gain.value=(mode==="play"||mode==="crash")?0.1:0.15;}
document.addEventListener("visibilitychange",function(){
  if(!AC)return;
  try{if(document.hidden)AC.suspend();else AC.resume();}catch(e){}
});

/* ---------- lettres du logo (traits épais) ---------- */
function arc(cx,cy,r,a0,a1,n){var o=[];for(var i=0;i<=n;i++){var a=a0+(a1-a0)*i/n;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return o;}
var GL={
 A:{w:0.78,s:[[[0,1],[0.39,0],[0.78,1]],[[0.15,0.68],[0.63,0.68]]]},
 B:{w:0.68,s:[[[0,0],[0,1]],[[0,0],[0.38,0]].concat(arc(0.38,0.25,0.25,-PI/2,PI/2,8)).concat([[0,0.5]]),[[0,0.5],[0.42,0.5]].concat(arc(0.42,0.75,0.25,-PI/2,PI/2,8)).concat([[0,1]])]},
 E:{w:0.7,s:[[[0.7,0],[0,0],[0,1],[0.7,1]],[[0,0.5],[0.56,0.5]]]},
 L:{w:0.68,s:[[[0,0],[0,1],[0.68,1]]]},
 R:{w:0.72,s:[[[0,1],[0,0],[0.4,0]].concat(arc(0.4,0.25,0.25,-PI/2,PI/2,8)).concat([[0,0.5]]),[[0.36,0.5],[0.72,1]]]},
 U:{w:0.74,s:[[[0,0],[0,0.62]].concat(arc(0.37,0.63,0.37,PI,0,12)).concat([[0.74,0]])]},
 N:{w:0.74,s:[[[0,1],[0,0],[0.74,1],[0.74,0]]]}
};
var GAP=0.26,WGAP=0.64,BALLR=0.2;
function lineItems(str,x0,y0,col){
  var items=[],x=x0;
  for(var i=0;i<str.length;i++){var g=GL[str.charAt(i)];items.push({ch:str.charAt(i),x:x,y:y0,col:col,g:g});x+=g.w+GAP;}
  return {items:items,end:x-GAP};
}

var R=CFG.ballR,GRAV=CFG.gravity,DRAWD=200,CH=6;
var SKY=[238,233,223],HAZE=[222,214,200],DEEP=[203,194,178];

var chunks=[],cubes=[],pads=[],G={z:0,n:0,last:"",demo:true};
function emitRoad(x0,x1,z0,z1,y){var z=z0,zc;while(z<z1-1e-6){zc=Math.min(z1,(Math.floor(z/CH+1e-6)+1)*CH);chunks.push({x0:x0,x1:x1,z0:z,z1:zc,ya:y,yb:y,sub:0,par:Math.floor(z/CH+1e-6)&1});z=zc;}}
function emitRamp(x0,x1,z0,z1,y0,y1){var len=z1-z0,z=z0,zc;while(z<z1-1e-6){zc=Math.min(z1,(Math.floor(z/CH+1e-6)+1)*CH);chunks.push({x0:x0,x1:x1,z0:z,z1:zc,ya:y0+(y1-y0)*(z-z0)/len,yb:y0+(y1-y0)*(zc-z0)/len,sub:1,par:0});z=zc;}}
function addCube(x,z,y,hw,mv){cubes.push({x:x,cx:x,z0:z,y:y,hw:hw,h:1.3,mv:mv||null});}
function addPad(x,z,y){pads.push({x:x,hw:1,z0:z,z1:z+4,y:y,used:false});}
function addRowOn(x0,x1,y,z,d,allowMover){
  var W=x1-x0,cx=(x0+x1)/2,r=Math.random(),i,f;
  if(W>=5){
    var lanes=[cx-2.2,cx,cx+2.2];
    if(allowMover&&d>0.2&&r<0.16+0.22*d){addCube(cx,z,y,0.9,{base:cx,amp:2.0,w:1.5+d*1.1,ph:rnd(0,6.28)});return;}
    if(d<0.12||r<0.3){addCube(lanes[(Math.random()*3)|0],z,y,0.9);return;}
    f=(Math.random()*3)|0;for(i=0;i<3;i++)if(i!==f)addCube(lanes[i],z,y,0.9);
  }else if(W>=3.6){
    addCube(cx+(Math.random()<0.5?-1:1)*(W/2-0.9),z,y,0.7);
  }else{
    addCube(cx+(Math.random()<0.5?-1:1)*(W/2-0.55),z,y,0.5);
  }
}
function lane(){return [-2.2,0,2.2][(Math.random()*3)|0];}
function secPlain(){emitRoad(-3.2,3.2,G.z,G.z+60,0);if(Math.random()<0.4)addPad(lane(),G.z+24,0);G.z+=60;G.last="plain";}
function secRows(sp,d){
  var len=6*Math.max(Math.round(rnd(10,16)),Math.ceil(sp*2.2/6));
  emitRoad(-3.2,3.2,G.z,G.z+len,0);
  for(var zr=G.z+sp*0.45;zr<G.z+len-sp*0.5;zr+=sp){
    addRowOn(-3.2,3.2,0,Math.round(zr),d,true);
    if(Math.random()<0.2)addPad(lane(),Math.round(zr+sp/2),0);
  }
  G.z+=len;G.last="rows";
}
function secBoost(sp,d){
  var len=6*Math.ceil((sp*2.2+12)/6);emitRoad(-3.2,3.2,G.z,G.z+len,0);
  addPad(lane(),G.z+8,0);addRowOn(-3.2,3.2,0,Math.round(G.z+8+sp*0.9),d,true);
  G.z+=len;G.last="boost";
}
function secJump(d){
  var cx=[-1.8,0,1.8][(Math.random()*3)|0],hw=1.5-0.4*d,gap=d<0.4?6:12;

  emitRoad(-3.2,3.2,G.z+12+gap,G.z+12+gap+54,0);

}
function secSplit(sp,d){
  var dir=Math.random()<0.5?-1:1,S=6*Math.round(rnd(8,11));
  var ux0=dir<0?-3.2:0.3,ux1=dir<0?-0.3:3.2,dx0=dir<0?0.3:-3.2,dx1=dir<0?3.2:-0.3,dcx=(dx0+dx1)/2;

function secBridge(sp,d){
  var wn=lerp(4.4,2.6,d),L=6*Math.round(rnd(7,10)),z=G.z,w=[5.6,Math.max(wn,4.8)];

function nextSection(){
  if(G.demo){secPlain();return;}
  var d=clamp(G.z/2500,0,1),sp=LV[lvl].v*1.15+(1-d)*10;
  G.n++;

  var o=[["rows",40],["boost",10]],last=G.last,i,tot=0,r;
  if(last!=="jump"&&last!=="split")o.push(["jump",16]);
  if(d>0.1&&last!=="split"&&last!=="jump")o.push(["split",14+10*d]);
  if(d>0.2&&last!=="bridge")o.push(["bridge",10]);
  for(i=0;i<o.length;i++)tot+=o[i][1];
  r=Math.random()*tot;var pick=o[0][0];
  for(i=0;i<o.length;i++){r-=o[i][1];if(r<=0){pick=o[i][0];break;}}
  if(pick==="rows")secRows(sp,d);else if(pick==="boost")secBoost(sp,d);else if(pick==="jump")secJump(d);
  else if(pick==="split")secSplit(sp,d);else secBridge(sp,d);

function resetWorld(demo){
  chunks=[];cubes=[];pads=[];G={z:60,n:0,last:"",demo:demo};

}
function ensureWorld(){
  var guard=0;while(G.z<B.z+DRAWD+40&&guard++<12)nextSection();
  var lim=B.z-40,i,a;
  a=[];for(i=0;i<chunks.length;i++)if(chunks[i].z1>lim)a.push(chunks[i]);chunks=a;
  a=[];for(i=0;i<cubes.length;i++)if(cubes[i].z0+2>lim)a.push(cubes[i]);cubes=a;
  a=[];for(i=0;i<pads.length;i++)if(pads[i].z1>lim)a.push(pads[i]);pads=a;

function groundAt(x,z,maxTop){
  var best=null;

    if(z>=c.z0&&z<=c.z1&&x>=c.x0-0.15&&x<=c.x1+0.15){

      if(y<=maxTop&&(best===null||y>best.y))best={y:y,slope:(c.yb-c.ya)/(c.z1-c.z0)};
    }
  }

}

function phys(dt,real){
  var bot=B.y-R,g;
  if(!B.air){
    g=groundAt(B.x,B.z,bot+0.45);
    if(!g||g.y<bot-0.25){B.air=true;if(g)B.vy=0;if(real&&B.vy>1.5&&!said.up){said.up=1;say("Décollage");sfx(260,620,0.25,"triangle",0.2);}}
    else{B.y=g.y+R;B.vy=g.slope*speed;}
  }

    B.vy-=GRAV*dt;B.y+=B.vy*dt;bot=B.y-R;

function updatePlay(dt){
  tm+=dt;

  if(joyOn){var j=Math.abs(joy)<0.07?0:(Math.abs(joy)-0.07)/0.93;tx+=Math.sign(joy)*Math.pow(j,1.6)*9*dt;}
  tx=clamp(tx,-5.4,5.4);

  if(boostT>0)boostT-=dt;

  B.z+=speed*dt;B.x+=(tx-B.x)*Math.min(1,dt*11);B.ph+=dt*(1.4+speed*0.025);

  var i,c,p;

  phys(dt,true);

    if(Math.abs(B.x-c.cx)<c.hw+0.8*R&&B.z+0.8*R>c.z0&&B.z-0.8*R<c.z0+1.8&&B.y-R<c.y+c.h-0.05){crash();return;}}

}
function updateDemo(dt){

var SW=0,SH=0,DPR=1,F=400,CY=0,camX=0,camY=0,camZ=0,fov=1;
var SPR=[];

  var cols=[["#FFFFFF","#EEE9DF","#A9A294"],["#F2B7A3","#C4614A","#7E3526"],["#C9DCCB","#7E9C86","#41594A"],["#AEBBDA","#6B7AA0","#2C3656"],["#F1E3C6","#D8C7A8","#8F7F5F"]];

    var g=x.createRadialGradient(34,30,4,48,48,46);g.addColorStop(0,c[0]);g.addColorStop(0.45,c[1]);g.addColorStop(1,c[2]);
    x.fillStyle=g;x.beginPath();x.arc(48,48,46,0,6.2832);x.fill();SPR.push(s);});
}
function css(c){return "rgb("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+")";}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function sh(c,k){return [c[0]*k,c[1]*k,c[2]*k];}

function P(x,y,z){var dz=z-camZ;if(dz<0.25)return null;var k=F*fov/dz;return [SW/2+(x-camX)*k,CY-(y-camY)*k,k];}

  ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(var i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.closePath();
  var s=typeof col==="string"?col:css(col);ctx.fillStyle=s;ctx.fill();
  if(typeof col!=="string"){ctx.strokeStyle=s;ctx.lineWidth=0.7;ctx.stroke();}
}
function slab(x0,x1,z0,z1,yf,yb,ybot,col,topC){
  var f=fogf(z0-camZ);
  var A=P(x0,ybot,z0),Bp=P(x1,ybot,z0),C=P(x1,yf,z0),D=P(x0,yf,z0),E=P(x0,yb,z1),Fq=P(x1,yb,z1),Gp=P(x0,ybot,z1),H=P(x1,ybot,z1);
  if(!(A&&Bp&&C&&D&&E&&Fq&&Gp&&H))return;
  if(camX<x0)poly([A,Gp,E,D],mix(sh(col,0.84),HAZE,f));
  if(camX>x1)poly([Bp,H,Fq,C],mix(sh(col,0.5),HAZE,f));
  poly([A,Bp,C,D],mix(sh(col,0.68),HAZE,f));
  poly([D,C,Fq,E],mix(topC||col,HAZE,f));
}
function drawChunk(c){
  var z0=Math.max(c.z0,camZ+0.7);if(c.z1<=z0)return;
  var ya=c.ya+(c.yb-c.ya)*((z0-c.z0)/(c.z1-c.z0)),base=c.sub?RAMPC:SLATE,top=c.par?mix(base,[255,255,255],0.05):base;

  for(var i=0;i<q.length;i++)if(!q[i])return;

}
function drawCube(c){

}
function importData(file){
  if(!file)return;var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);if(!d||d.app!=="abel-run"||!Array.isArray(d.runs))throw new Error("format");
      var seen={},out=[];
      loadRuns().concat(d.runs.filter(validRun)).forEach(function(r){var k=r.t+"_"+r.l+"_"+r.s;if(!seen[k]){seen[k]=1;out.push({s:Math.floor(r.s),t:r.t,l:r.l});}});
      out.sort(function(a,b){return a.t-b.t;});saveRuns(out);
      if(Array.isArray(d.best))for(var i=0;i<LV.length;i++){var v=Math.floor(+d.best[i]||0);if(v>(parseInt(sGet("best"+i)||"0",10)||0))sSet("best"+i,String(v));}
      setLvlUI();panelData();$("dmsg").textContent="Import réussi.";
    }catch(e){$("dmsg").textContent="Fichier non valide.";}
  };
  rd.onerror=function(){$("dmsg").textContent="Lecture impossible.";};rd.readAsText(file);
}
var deferred=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;});
function isStandalone(){try{return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;}catch(e){return false;}}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);}
function panelInstall(){
  if(deferred){var d=deferred;deferred=null;try{d.prompt();}catch(e){}return;}
  var b;
  if(isIOS())b='<p><b>iPhone / iPad (Safari)</b></p><ol><li>Touche le bouton <b>Partager</b> (carré avec une flèche vers le haut).</li><li>Fais défiler et choisis <b>Sur l’écran d’accueil</b>.</li><li>Touche <b>Ajouter</b>.</li></ol>';
  else b='<p><b>Android (Chrome)</b> : bouton « Installer » du menu, ou menu ⋮ puis <b>Installer l’application</b>.</p><p><b>PC (Chrome / Edge)</b> : icône d’installation à droite de la barre d’adresse.</p><p><b>iPhone / iPad</b> : Safari, bouton Partager puis <b>Sur l’écran d’accueil</b>.</p>';
  openPanel('<h2>Installer Abel Run</h2>'+b+'<p>Une fois installé, le jeu s’ouvre en plein écran et fonctionne sans connexion.</p>'+CLOSE);
}

/* ---------- entrées, boucle, démarrage ---------- */
var dragging=false,lastX=0;
cv.addEventListener("pointerdown",function(e){if(mode!=="play"||e.pointerType==="mouse")return;dragging=true;lastX=e.clientX;try{cv.setPointerCapture(e.pointerId);}catch(x){}});
cv.addEventListener("pointermove",function(e){if(!dragging||mode!=="play")return;tx+=(e.clientX-lastX)*(7/(Math.min(SW,SH*0.5625)*0.5));lastX=e.clientX;tx=clamp(tx,-5.4,5.4);});
window.addEventListener("pointermove",function(e){
  if(e.pointerType!=="mouse")return;
  joyOn=true;joy=clamp((e.clientX-SW/2)/(SW*0.28),-1,1);
  var d=$("joy");if(d){d.style.display=(mode==="play")?"block":"none";d.firstChild.style.left=(50+joy*46)+"%";}
});
function endDrag(){dragging=false;}
cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);
document.addEventListener("touchmove",function(e){if(!e.target.closest||!e.target.closest(".card,.screen.on"))e.preventDefault();},{passive:false});
document.addEventListener("contextmenu",function(e){e.preventDefault();});
window.addEventListener("pointerdown",unlock,true);
window.addEventListener("keydown",function(e){
  unlock();var k=e.code;
  if(k==="ArrowLeft"||k==="KeyA"||k==="KeyQ"){keys.l=true;e.preventDefault();}
  else if(k==="ArrowRight"||k==="KeyD"){keys.r=true;e.preventDefault();}
  else if(k==="KeyP"||k==="Escape"){if(mode==="play")pauseGame();else if(mode==="pause")resumeGame();else closePanel();}
  else if(k==="Enter"||k==="Space"){e.preventDefault();if(!$("panel").classList.contains("on")){if(mode==="menu"||mode==="over")startGame();else if(mode==="pause")resumeGame();else if(mode==="intro")skipIntro();}}
});
window.addEventListener("keyup",function(e){var k=e.code;if(k==="ArrowLeft"||k==="KeyA"||k==="KeyQ")keys.l=false;if(k==="ArrowRight"||k==="KeyD")keys.r=false;});
window.addEventListener("blur",function(){keys.l=false;keys.r=false;pauseGame();});
document.addEventListener("visibilitychange",function(){if(document.hidden)pauseGame();});
$("bplay").onclick=startGame;$("bagain").onclick=startGame;$("bmenu").onclick=toMenu;$("bquit").onclick=toMenu;
$("bpause").onclick=pauseGame;$("bresume").onclick=resumeGame;$("skip").onclick=skipIntro;$("bintro").onclick=startIntro;
$("bmute").onclick=function(){muted=!muted;sSet("mute",muted?"1":"0");unlock();updMute();};
$("babout").onclick=panelAbout;$("bpriv").onclick=panelPriv;$("bdata").onclick=panelData;$("binstall").onclick=panelInstall;
$("panel").addEventListener("pointerdown",function(e){if(e.target===$("panel"))closePanel();});

function resize(){
  SW=window.innerWidth;SH=window.innerHeight;DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=icv.width=Math.round(SW*DPR);cv.height=icv.height=Math.round(SH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var U=Math.min(SW,SH*0.5625);document.documentElement.style.setProperty("--u",(U/100)+"px");
  F=Math.min(1.12*SW,0.9*SH);if(SW>SH*1.1)F=Math.min(SH*0.62*1.12*1.4,SW);F=Math.min(F,SH*0.95);CY=SH*0.36;
  layoutIntro();
}
var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  if(mode==="intro"){var idt=Math.min(0.05,Math.max(0,(now-introLast)/1000));introLast=now;introFrame((now-introT0)/1000,idt);}
  else if(mode==="intro-fade"){}
  if(mode==="play")updatePlay(dt);
  else if(mode==="crash"||mode==="fall")updateEnd(dt);
  else if(mode==="menu"||mode==="intro"){if(started)updateDemo(dt);}
  if(started||mode!=="intro")render();
  if(icv.style.display!=="none"&&mode==="menu"&&parseFloat(icv.style.opacity)>0&&false){}
}
makeSprites();buildBrand();buildLevelButtons();setLvlUI();updMute();
resize();
window.addEventListener("resize",resize);
if("ResizeObserver" in window){}
if(isStandalone())$("binstall").style.display="none";
try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}
startDemo();setBody();
if(window.__ABEL_TEST){window.__ABEL_TEST({
  newGame:function(l){lvl=l;resetWorld(false);newBall();tx=0;speed=LV[lvl].v*0.5;tm=0;boostT=0;bonus=0;said={};parts=[];shake=0;mode="play";ensureWorld();},
  step:function(dt){updatePlay(dt);},render:render,introFrame:introFrame,
  setTx:function(v){tx=v;},world:function(){return {chunks:chunks,cubes:cubes,pads:pads,B:B,mode:mode,speed:speed,G:G};},
  size:function(w,h){SW=w;SH=h;F=Math.min(1.12*SW,0.9*SH);CY=SH*0.36;layoutIntro();},
  groundAt:groundAt,demo:function(){startDemo();mode="menu";started=true;},stepDemo:updateDemo,burst:function(){return iParts.length;}
});}
else{introT0=performance.now();introLast=introT0;requestAnimationFrame(frame);}
})();
